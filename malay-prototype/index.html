<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kata Kita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone column; songket-patterned header band, content sheet, floating dock.
   Palette from a Malaysian kitchen & loom: songket indigo, kunyit gold, pandan green, sambal red. */
:root {
  --bg: #EFF2EC;          /* pale pandan wash */
  --sheet: #FAFBF8;
  --ink: #1B2140;         /* songket indigo */
  --ink-2: #545B78;
  --ink-3: #8B90A6;
  --line: #DCE1D8;
  --gold: #D9961A;        /* kunyit */
  --gold-soft: #F6E7C4;
  --pandan: #2E8B57;
  --pandan-soft: #D8EEDF;
  --sambal: #CF3E2C;
  --sambal-soft: #F7DCD6;
  --band: #1B2140;
  --band-ink: #F4E2B5;
  --soil: #8A5A3B;
  --pot: #C46A43;
  --leaf: #3C9A5F;
  --card: #FFFFFF;
  --shadow: 0 18px 40px -22px rgba(27,33,64,.45);
  --dock: #1B2140;
  --dock-ink: #FAFBF8;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --jawi: 'Noto Naskh Arabic', 'Geeza Pro', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1226; --sheet: #161A33; --ink: #ECEEF6; --ink-2: #B3B8CF; --ink-3: #7C82A0; --line: #272C4A;
  --gold: #F0B23A; --gold-soft: #3A3120; --pandan: #4FC07D; --pandan-soft: #183428; --sambal: #F0624F; --sambal-soft: #3D1E1E;
  --band: #0A0C1C; --band-ink: #F0B23A; --soil: #6E4A33; --pot: #A85A39; --leaf: #4FB574; --card: #1D2240;
  --shadow: 0 18px 40px -20px rgba(0,0,0,.7); --dock: #070915; --dock-ink: #ECEEF6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1226; --sheet: #161A33; --ink: #ECEEF6; --ink-2: #B3B8CF; --ink-3: #7C82A0; --line: #272C4A;
  --gold: #F0B23A; --gold-soft: #3A3120; --pandan: #4FC07D; --pandan-soft: #183428; --sambal: #F0624F; --sambal-soft: #3D1E1E;
  --band: #0A0C1C; --band-ink: #F0B23A; --soil: #6E4A33; --pot: #A85A39; --leaf: #4FB574; --card: #1D2240;
  --shadow: 0 18px 40px -20px rgba(0,0,0,.7); --dock: #070915; --dock-ink: #ECEEF6; color-scheme: dark; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.jawi { font-family: var(--jawi); direction: rtl; }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* ── songket band ── */
.band { position: relative; background: var(--band); color: var(--band-ink); padding: 18px 20px 46px; overflow: hidden; }
.band::before { content: ''; position: absolute; inset: 0; opacity: .22;
  background:
    linear-gradient(45deg, transparent 46%, var(--band-ink) 46% 54%, transparent 54%) 0 0 / 22px 22px,
    linear-gradient(-45deg, transparent 46%, var(--band-ink) 46% 54%, transparent 54%) 0 0 / 22px 22px; }
.band::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
  background: repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 14px, var(--sambal) 14px 18px, transparent 18px 22px); opacity: .9; }
.band > * { position: relative; }
.band-top { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: -.3px; flex: 1; }
.brand small { font-family: var(--jawi); font-size: 16px; opacity: .8; margin-left: 6px; }
.band-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--band-ink) 40%, transparent); display: grid; place-items: center; color: var(--band-ink); }
.band h1 { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: .98; letter-spacing: -1.2px; margin-top: 22px; text-wrap: balance; }
.band .sub { font-size: 14px; font-weight: 600; opacity: .75; margin-top: 6px; }
.sheet > * { min-width: 0; }
.band.compact { padding-bottom: 38px; }
.band.compact h1 { font-size: 30px; margin-top: 14px; }
.sheet { background: var(--bg); margin-top: -24px; border-radius: 24px 24px 0 0; position: relative; padding: 22px 16px 8px; display: grid; gap: 16px; }

.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-3); }
.h2 { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.4px; }
.muted { color: var(--ink-2); }

/* ── home ── */
.peri { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; position: relative; overflow: hidden; }
.peri .ms { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; margin: 8px 0 6px; text-wrap: balance; }
.peri .lit { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.peri .use { font-size: 13px; margin-top: 8px; font-weight: 600; }
.peri .use b { color: var(--pandan); }
.peri-mark { position: absolute; right: -4px; bottom: -18px; font-family: var(--jawi); font-size: 64px; color: var(--gold); opacity: .12; pointer-events: none; }
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tcard { text-align: left; border-radius: 18px; padding: 16px; min-height: 132px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.tcard .num { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.tcard .lbl { font-weight: 700; font-size: 14px; line-height: 1.25; }
.tcard .go { font-size: 12px; font-weight: 800; }
.t-learn { background: var(--ink); color: var(--sheet); grid-row: span 2; min-height: 274px; }
.t-learn .stack { display: grid; gap: 6px; }
.t-learn .chip { display: inline-block; background: color-mix(in srgb, var(--sheet) 12%, transparent); padding: 5px 9px; border-radius: 6px; font-weight: 700; font-size: 13px; margin: 0 4px 4px 0; }
.t-garden { background: var(--pandan-soft); color: var(--ink); }
.t-garden .num { color: var(--pandan); }
.t-map { background: var(--gold-soft); color: var(--ink); }
.t-map .num { color: var(--gold); font-size: 26px; }
.mamak-cta { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--sheet); border: 1.5px dashed var(--sambal); border-radius: 18px; padding: 14px 16px; }
.mamak-cta .ic { width: 46px; height: 46px; border-radius: 12px; background: var(--sambal-soft); display: grid; place-items: center; font-size: 22px; flex: none; }
.mamak-cta b { font-family: var(--display); font-size: 17px; }

/* ── learn: swipe deck ── */
.deck-head { display: flex; align-items: center; gap: 10px; }
.deck-head .h2 { flex: 1; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 6px; border-radius: 3px; background: var(--line); }
.pips i.k { background: var(--pandan); } .pips i.f { background: var(--sambal); } .pips i.c { background: var(--ink); }
.deck { position: relative; height: clamp(270px, calc(100vh - 500px), 420px); perspective: 1200px; touch-action: pan-y; }
.card { position: absolute; inset: 0; border-radius: 26px; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.8,.2,1); user-select: none; }
.card.behind { transform: translateY(14px) scale(.95); filter: brightness(.97); }
.card.behind2 { transform: translateY(28px) scale(.9); filter: brightness(.94); }
.card.dragging { transition: none; }
.face { position: absolute; inset: 0; border-radius: 26px; background: var(--card); box-shadow: var(--shadow); border: 1.5px solid var(--line); backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 22px; display: flex; flex-direction: column; overflow: hidden; }
.face.back { transform: rotateY(180deg); overflow-y: auto; }
.card.flipped .front-wrap { transform: rotateY(180deg); }
.front-wrap { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.9,.3,1); }
.face .strip { position: absolute; left: 0; right: 0; top: 0; height: 8px; background: repeating-linear-gradient(90deg, var(--gold) 0 10px, var(--ink) 10px 13px); }
.face .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: var(--ink-3); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
.tag { padding: 3px 8px; border-radius: 6px; background: var(--gold-soft); color: var(--ink); letter-spacing: .5px; }
.big { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.big .w { font-family: var(--display); font-weight: 800; font-size: 54px; letter-spacing: -1.6px; line-height: 1; overflow-wrap: anywhere; }
.big .j { font-family: var(--jawi); font-size: 34px; color: var(--ink-3); }
.big .hint { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.speak { width: 44px; height: 44px; border-radius: 50%; background: var(--gold-soft); display: grid; place-items: center; }
.back .mean { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.6px; line-height: 1.05; margin-top: 10px; }
.back .syl { font-size: 15px; font-weight: 700; color: var(--ink-2); margin-top: 6px; }
.back .syl em { font-style: normal; color: var(--gold); }
.row-lbl { font-size: 10px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-3); margin: 16px 0 6px; }
.morph { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.seg { padding: 4px 9px; border-radius: 6px; font-weight: 800; font-size: 15px; }
.seg.pre { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--ink); }
.seg.root { background: var(--pandan-soft); color: var(--pandan); }
.seg.suf { background: var(--sambal-soft); color: var(--sambal); }
.ex { font-weight: 700; font-size: 15px; line-height: 1.4; }
.ex small { display: block; font-weight: 600; color: var(--ink-2); font-size: 13px; }
.swipe-stamp { position: absolute; top: 34px; padding: 6px 12px; border: 3px solid; border-radius: 8px; font-family: var(--display); font-weight: 800; font-size: 22px; opacity: 0; transform: rotate(-12deg); z-index: 3; pointer-events: none; }
.stamp-yes { left: 22px; color: var(--pandan); }
.stamp-no { right: 22px; color: var(--sambal); transform: rotate(12deg); }
.deck-actions { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.big-btn { height: 56px; border-radius: 16px; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.b-no { background: var(--sambal-soft); color: var(--sambal); }
.b-yes { background: var(--pandan); color: #fff; }
.b-flip { width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--sheet); font-size: 20px; }
.deck-note { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.done-box { background: var(--sheet); border-radius: 22px; border: 1.5px solid var(--line); padding: 26px 20px; text-align: center; display: grid; gap: 10px; }
.done-box .h { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -1px; }
.btn { height: 50px; border-radius: 14px; font-weight: 800; padding: 0 18px; }
.btn-ink { background: var(--ink); color: var(--sheet); }
.btn-line { border: 1.5px solid var(--line); background: var(--sheet); }
.topics { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.topic { flex: none; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 700; font-size: 13px; background: var(--sheet); }
.topic.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.front-mode { display: flex; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; }
.front-mode button { flex: 1; padding: 8px 4px; border-radius: 9px; font-weight: 800; font-size: 12px; color: var(--ink-2); }
.front-mode button.on { background: var(--gold-soft); color: var(--ink); }

/* ── garden (SRS) ── */
.garden { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.plot { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 16px; padding: 8px 6px 10px; text-align: center; position: relative; }
.plot.thirsty { border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }
.plot svg { width: 100%; height: 82px; display: block; }
.plot .pw { font-weight: 800; font-size: 14px; overflow-wrap: anywhere; }
.plot .ps { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.drop { position: absolute; top: 6px; right: 7px; font-size: 10px; font-weight: 800; color: var(--gold); }
.legend-row { display: flex; justify-content: space-between; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 10px; }
.legend-row div { text-align: center; font-size: 10px; font-weight: 800; color: var(--ink-3); }
.legend-row svg { width: 38px; height: 38px; display: block; margin: 0 auto; }
.water-q { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 14px; }
.water-q .w { font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: -1px; text-align: center; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); font-weight: 700; background: var(--bg); }
.opt.right { border-color: var(--pandan); background: var(--pandan-soft); color: var(--pandan); }
.opt.wrong { border-color: var(--sambal); background: var(--sambal-soft); color: var(--sambal); }

/* ── map (course) ── */
.map-wrap { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 22px; overflow: hidden; }
.map-wrap svg { width: 100%; height: auto; display: block; }
.stop-sheet { background: var(--ink); color: var(--sheet); border-radius: 22px; padding: 18px; display: grid; gap: 12px; }
.stop-sheet .h2 { color: var(--sheet); }
.step { display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--sheet) 8%, transparent); }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; border: 1.5px solid color-mix(in srgb, var(--sheet) 40%, transparent); flex: none; }
.step.ok .n { background: var(--pandan); border-color: var(--pandan); color: #fff; }
.step b { display: block; font-size: 15px; } .step span { font-size: 12px; opacity: .7; font-weight: 600; }
@keyframes pulse { 0%,100% { r: 17; opacity: .5; } 50% { r: 24; opacity: 0; } }
.pulse { animation: pulse 1.8s ease-in-out infinite; }

/* ── workshop (imbuhan) ── */
.result { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); border: 1.5px solid var(--line); padding: 22px 18px; text-align: center; min-height: 196px; display: grid; align-content: center; gap: 8px; position: relative; overflow: hidden; }
.result .word { font-family: var(--display); font-weight: 800; font-size: 46px; letter-spacing: -1.4px; line-height: 1; }
.result .word .p { color: var(--gold); } .result .word .r { color: var(--pandan); } .result .word .s { color: var(--sambal); }
.result .eq { font-size: 13px; font-weight: 700; color: var(--ink-3); }
.result .m { font-weight: 800; font-size: 18px; }
.result .rule { font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--bg); border-radius: 10px; padding: 8px 10px; justify-self: center; max-width: 100%; }
.result.miss .word { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--sambal); }
.result .newbadge { position: absolute; top: 12px; right: 12px; background: var(--pandan); color: #fff; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 4px 8px; border-radius: 6px; }
.slot-lbl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.slot-lbl .eyebrow b { color: var(--ink); }
.slot { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.piece { flex: none; padding: 10px 13px; border-radius: 10px; font-weight: 800; font-size: 15px; border: 1.5px solid var(--line); background: var(--sheet); }
.piece.on.pre { background: var(--gold); border-color: var(--gold); color: #1B2140; }
.piece.on.root { background: var(--pandan); border-color: var(--pandan); color: #fff; }
.piece.on.suf { background: var(--sambal); border-color: var(--sambal); color: #fff; }
.found { display: flex; flex-wrap: wrap; gap: 6px; }
.found span { padding: 5px 9px; border-radius: 6px; background: var(--sheet); border: 1.5px solid var(--line); font-weight: 700; font-size: 13px; }
.found span.ghost { color: transparent; background: repeating-linear-gradient(45deg, var(--line) 0 2px, transparent 2px 6px); width: 64px; }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pandan); border-radius: 4px; transition: width .4s; }

/* ── mamak role-play ── */
.chat { display: grid; gap: 8px; }
.msg { max-width: 84%; padding: 11px 14px; border-radius: 18px; font-weight: 700; line-height: 1.35; }
.msg small { display: block; font-weight: 600; font-size: 12px; opacity: .7; margin-top: 2px; }
.msg.them { background: var(--sheet); border: 1.5px solid var(--line); border-bottom-left-radius: 4px; }
.msg.me { background: var(--ink); color: var(--sheet); margin-left: auto; border-bottom-right-radius: 4px; }
.msg.note { max-width: 100%; background: var(--gold-soft); font-size: 13px; border-radius: 12px; }
.replies { display: grid; gap: 8px; }
.reply { text-align: left; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--ink); font-weight: 700; background: var(--sheet); }
.reply.wrong { border-color: var(--sambal); color: var(--sambal); background: var(--sambal-soft); }
.who { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); }

/* ── dock ── */
.dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 24px); max-width: 416px; background: var(--dock); border: 1px solid color-mix(in srgb, var(--dock-ink) 10%, transparent); border-radius: 22px; display: flex; padding: 6px; z-index: 40; box-shadow: 0 16px 36px -16px rgba(0,0,0,.5); }
.dock button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 16px; color: color-mix(in srgb, var(--dock-ink) 60%, transparent); font-size: 10.5px; font-weight: 800; }
.dock button svg { width: 22px; height: 22px; }
.dock button.on { background: color-mix(in srgb, var(--dock-ink) 12%, transparent); color: var(--gold); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 13px; z-index: 60; max-width: 90%; text-align: center; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<div id="app"><div id="view"></div></div>

<script>
// ═══════════ SAMPLE CONTENT ═══════════
const TOPICS = [
  { id: 'all', name: 'Semua · All' }, { id: 'salam', name: 'Salam' }, { id: 'makan', name: 'Makan' },
  { id: 'jalan', name: 'Jalan' }, { id: 'wang', name: 'Wang' }, { id: 'pasar', name: 'Cakap pasar' },
];
// parts: [text, pre|root|suf]
const WORDS = [
  { id: 1, t: 'salam', ms: 'selamat pagi', en: 'good morning', syl: 'se·la·mat pa·gi', jawi: 'سلامت ڤاݢي', ex: 'Selamat pagi, cikgu!', exEn: 'Good morning, teacher!' },
  { id: 2, t: 'salam', ms: 'apa khabar', en: 'how are you?', syl: 'a·pa kha·bar', jawi: 'اڤ خبر', ex: 'Apa khabar? — Khabar baik.', exEn: 'How are you? — I’m well.' },

  } catch { toast('No speech voice on this device'); }
}

    </div>
    <div class="face back"><div class="strip"></div>
      <div class="meta"><span>${esc(w.ms)}</span><button class="speak" style="width:36px;height:36px" data-act="speak" data-say="${esc(w.ms)}" aria-label="Hear it">${IC.sound}</button></div>
      <div class="mean">${esc(w.en)}</div>
      <div class="syl">${esc(w.syl).replace(/·/g, '<em>·</em>')}</div>
      <div class="row-lbl">Built from</div>
      <div class="morph">${w.parts ? segs(w.parts) : `<span class="seg root">${esc(w.ms)}</span><span class="muted" style="font-size:12px;font-weight:700">&nbsp;base word</span>`}</div>
      <div class="row-lbl">In a sentence</div>
      <div class="ex">${esc(w.ex)}<small>${esc(w.exEn)}</small></div>
      <div class="row-lbl">Jawi</div><div class="jawi" style="font-size:24px;text-align:left">${w.jawi}</div>
    </div>`;
}
function Learn() {
  if (!st.deck.length) newDeck();
  const head = band('Belajar', 'Swipe right if you knew it, left if you didn’t.', '', true);
  const top = `<div class="topics">${TOPICS.map(t => `<button class="topic ${st.topic === t.id ? 'on' : ''}" data-topic="${t.id}">${t.name}</button>`).join('')}</div>
    <div class="front-mode" role="group" aria-label="Card front">${[['ms', 'Malay first'], ['en', 'English first'], ['jawi', 'Jawi first']].map(([k, l]) => `<button class="${st.front === k ? 'on' : ''}" data-front="${k}">${l}</button>`).join('')}</div>`;
  if (st.i >= st.deck.length) {
    const known = Object.values(st.marks).filter(Boolean).length;
    return head + `<main class="sheet">${top}<div class="done-box"><div class="eyebrow">Deck finished</div><div class="h">${known} / ${st.deck.length}</div><div class="muted" style="font-weight:600">${known === st.deck.length ? 'Hebat! Every card sorted to the right.' : `${st.deck.length - known} word${st.deck.length - known > 1 ? 's' : ''} planted as seeds in your Kebun.`}</div><button class="btn btn-ink" data-act="redeal">Deal a new deck</button><button class="btn btn-line" data-tab="garden">Visit the garden</button></div></main>`;
  }
  const cards = st.deck.slice(st.i, st.i + 3).map((w, k) => `<div class="card ${k === 1 ? 'behind' : k === 2 ? 'behind2' : ''} ${k === 0 && st.flipped ? 'flipped' : ''}" ${k === 0 ? 'id="top" tabindex="0" aria-label="Flashcard. Press space to flip, arrow keys to sort."' : 'aria-hidden="true"'} style="z-index:${3 - k}">
      ${k === 0 ? '<div class="swipe-stamp stamp-yes">INGAT</div><div class="swipe-stamp stamp-no">BELUM</div>' : ''}
      <div class="front-wrap">${cardFaces(w)}</div></div>`).join('');
  return head + `<main class="sheet">${top}
    <div class="deck-head"><div class="h2">${st.i + 1}<span class="muted" style="font-size:16px"> of ${st.deck.length}</span></div><div class="pips">${st.deck.map((w, k) => `<i class="${k in st.marks ? (st.marks[k] ? 'k' : 'f') : k === st.i ? 'c' : ''}"></i>`).join('')}</div></div>
    <div class="deck" id="deck">${cards}</div>
    <div class="deck-actions">
      <button class="big-btn b-no" data-act="sort" data-v="0">← Belum</button>
      <button class="b-flip" data-act="flip" aria-label="Flip card">↻</button>
      <button class="big-btn b-yes" data-act="sort" data-v="1">Ingat →</button>
    </div>
  </main>`;
}

function Garden() {
  const thirsty = st.garden.filter(g => g.due);
  if (st.watering) {
    const w = st.watering;
    const word = byId(w.g.id);
    return band('Siram', `Watering ${w.done + 1} of ${w.total}. A right answer helps it grow.`) + `<main class="sheet">
      <div class="water-q">
        <div style="display:flex;justify-content:center">${plant(w.g.stage, 110)}</div>
        <div class="w">${esc(word.ms)}</div>
        <div class="opts">${w.opts.map((o, k) => { let c = ''; if (w.pick != null) { if (o.id === word.id) c = 'right'; else if (k === w.pick) c = 'wrong'; } return `<button class="opt ${c}" data-opt="${k}" ${w.pick != null ? 'disabled' : ''}>${esc(o.en)}</button>`; }).join('')}</div>
        ${w.pick != null ? `<div class="muted" style="font-weight:700;text-align:center">${w.ok ? `Tumbuh! It grew to “${STAGES[w.g.stage].split(' · ')[1]}”.` : 'It stays as it is and comes back sooner.'}</div><button class="btn btn-ink" data-act="water-next">${w.done + 1 < w.total ? 'Next plant →' : 'Finish'}</button>` : ''}
      </div></main>`;
  }
  return band('Kebun', 'Every word is a plant. Review it to help it grow into a bunga raya.') + `<main class="sheet">
    <div class="legend-row" aria-label="Growth stages">${STAGES.map((s, k) => `<div>${plant(k, 38)}${s.split(' · ')[0]}</div>`).join('')}</div>
    <button class="btn btn-ink" data-act="water" ${thirsty.length ? '' : 'disabled'} style="${thirsty.length ? '' : 'opacity:.5'}">💧 Water ${thirsty.length} thirsty plant${thirsty.length === 1 ? '' : 's'}</button>
    <div class="garden">${st.garden.map(g => { const w = byId(g.id); return `<div class="plot ${g.due ? 'thirsty' : ''}">${g.due ? '<span class="drop">💧 dry</span>' : ''}${plant(g.stage)}<div class="pw">${esc(w.ms)}</div><div class="ps">${STAGES[g.stage].split(' · ')[1]}</div></div>`; }).join('')}</div>
    <p class="muted" style="font-size:12px;font-weight:600">Bunga raya, the hibiscus, is Malaysia’s national flower. A word in bloom has been recalled across several weeks.</p>
  </main>`;
}

function MapView() {
  const pathD = STOPS.map((s, k) => k === 0 ? `M${s.x} ${s.y}` : `C${STOPS[k - 1].x} ${(STOPS[k - 1].y + s.y) / 2 - 10}, ${s.x} ${(STOPS[k - 1].y + s.y) / 2 + 10}, ${s.x} ${s.y}`).join(' ');
  const doneUpTo = STOPS.findIndex(s => s.current);
  const donePath = STOPS.slice(0, doneUpTo + 1).map((s, k) => k === 0 ? `M${s.x} ${s.y}` : `C${STOPS[k - 1].x} ${(STOPS[k - 1].y + s.y) / 2 - 10}, ${s.x} ${(STOPS[k - 1].y + s.y) / 2 + 10}, ${s.x} ${s.y}`).join(' ');
  const sel = STOPS.find(s => s.n === st.stop);
  const locked = !sel.done && !sel.current;
  return band('Peta', 'Six stops across Malaysia. Each one is a unit of real situations.') + `<main class="sheet">
    <div class="map-wrap"><svg viewBox="0 0 360 620" role="img" aria-label="Course route map">
      <defs><pattern id="sea" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 7q3.5-4 7 0t7 0" fill="none" stroke="var(--line)" stroke-width="1.2"/></pattern></defs>
      <rect width="360" height="620" fill="url(#sea)"/>
      <path d="${pathD}" fill="none" stroke="var(--ink-3)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
      <path d="${donePath}" fill="none" stroke="var(--pandan)" stroke-width="5" stroke-linecap="round"/>
      ${STOPS.map(s => {
        const right = s.x < 180;
        const fill = s.done ? 'var(--pandan)' : s.current ? 'var(--gold)' : 'var(--sheet)';
        const stroke = s.done ? 'var(--pandan)' : s.current ? 'var(--gold)' : 'var(--ink-3)';
        return `<g data-stop="${s.n}" style="cursor:pointer" tabindex="0" role="button" aria-label="Stop ${s.n}: ${s.town}">
          ${s.current ? `<circle class="pulse" cx="${s.x}" cy="${s.y}" r="17" fill="var(--gold)"/>` : ''}
          <circle cx="${s.x}" cy="${s.y}" r="${st.stop === s.n ? 18 : 15}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>
          <text x="${s.x}" y="${s.y + 5}" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="14" fill="${s.done || s.current ? '#1B2140' : 'var(--ink-3)'}">${s.done ? '✓' : s.n}</text>
          <text x="${right ? s.x + 28 : s.x - 28}" y="${s.y - 2}" text-anchor="${right ? 'start' : 'end'}" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="17" fill="var(--ink)">${s.town}</text>
          <text x="${right ? s.x + 28 : s.x - 28}" y="${s.y + 16}" text-anchor="${right ? 'start' : 'end'}" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="var(--ink-2)">${s.unit}</text>
        </g>`;
      }).join('')}
    </svg></div>
    <section class="stop-sheet" aria-live="polite">
      <div class="eyebrow" style="color:var(--gold)">Stop ${sel.n} · ${sel.town}${sel.done ? ' · selesai (done)' : sel.current ? ' · you are here' : ' · locked'}</div>
      <div class="h2">${sel.unit} <span style="opacity:.6;font-weight:600;font-size:15px">${sel.en}</span></div>
      ${locked ? `<div style="opacity:.75;font-weight:600;font-size:14px">Finish ${STOPS.find(s => s.current).town} to travel here.</div>` :
        STOP_STEPS.map(([t, d, ok], k) => { const isOk = sel.done || ok; return `<button class="step ${isOk ? 'ok' : ''}" data-step="${k}"><span class="n">${isOk ? '✓' : k + 1}</span><span><b>${t}</b><span>${d}</span></span></button>`; }).join('')}
    </section>
  </main>`;
}

function Shop() {
  const key = `${st.pre}|${st.root}|${st.suf}`;
  const f = FORMS[key];
  const total = Object.keys(FORMS).length;
  const pieceLbl = (p, k) => p ? (k === 'pre' ? p + '-' : '-' + p) : '—';
  const eq = [st.pre && st.pre + '-', st.root, st.suf && '-' + st.suf].filter(Boolean).join(' + ');
  let res;
  if (f) res = `<div class="result">${st.lastNew ? '<span class="newbadge">NEW</span>' : ''}<div class="eq">${esc(eq)} =</div><div class="word">${f[0].map(([t, k]) => `<span class="${k}">${esc(t)}</span>`).join('')}</div><div class="m">${esc(f[1])}</div><div class="rule">${esc(f[2])}</div><button class="speak" style="justify-self:center" data-act="speak" data-say="${esc(f[0].map(x => x[0]).join(''))}" aria-label="Hear it">${IC.sound}</button></div>`;
  else res = `<div class="result miss"><div class="eq">${esc(eq)} =</div><div class="word">${esc((st.pre ? st.pre.replace('N', '') : '') + st.root + st.suf)}</div><div class="m">Bukan perkataan · not a word</div><div class="rule">Not every affix fits every root. Try a different prefix or suffix.</div></div>`;
  return band('Bengkel Imbuhan', 'The affix workshop. Snap a prefix and a suffix onto a root and see what Malay makes of it.') + `<main class="sheet">
    ${res}
    <div><div class="slot-lbl"><span class="eyebrow">Awalan · <b>prefix</b></span></div><div class="slot">${PREFIXES.map(p => `<button class="piece pre ${st.pre === p ? 'on' : ''}" data-pre="${p}">${pieceLbl(p, 'pre')}</button>`).join('')}</div></div>
    <div><div class="slot-lbl"><span class="eyebrow">Kata dasar · <b>root</b></span></div><div class="slot">${Object.entries(ROOTS).map(([r, en]) => `<button class="piece root ${st.root === r ? 'on' : ''}" data-root="${r}">${r} <span style="font-weight:600;opacity:.7;font-size:12px">${en}</span></button>`).join('')}</div></div>
    <div><div class="slot-lbl"><span class="eyebrow">Akhiran · <b>suffix</b></span></div><div class="slot">${SUFFIXES.map(s => `<button class="piece suf ${st.suf === s ? 'on' : ''}" data-suf="${s}">${pieceLbl(s, 'suf')}</button>`).join('')}</div></div>
    <div style="display:grid;gap:8px">
      <div class="slot-lbl"><span class="eyebrow">Your collection</span><span style="font-weight:800;font-size:13px">${st.found.size} / ${total}</span></div>
      <div class="meter"><i style="width:${st.found.size / total * 100}%"></i></div>
      <div class="found">${[...st.found].map(k => `<span>${esc(FORMS[k][0].map(x => x[0]).join(''))}</span>`).join('')}${Array.from({ length: Math.min(6, total - st.found.size) }, () => '<span class="ghost">·</span>').join('')}</div>
    </div>
  </main>`;
}

function Mamak() {
  const m = st.mamak;
  const lines = [];
  for (let k = 0; k <= m.step && k < MAMAK.length; k++) {
    lines.push(`<div><div class="who">Pelayan · waiter</div><div class="msg them">${esc(MAMAK[k].them)}<small>${esc(MAMAK[k].them_en)}</small></div></div>`);
    if (m.answers[k]) lines.push(`<div class="msg me">${esc(m.answers[k][0])}</div><div class="msg note">💡 ${esc(m.answers[k][2])}</div>`);
  }
  const cur = MAMAK[m.step];
  const finished = m.step >= MAMAK.length;
  return band('Gerai Mamak', 'Pulau Pinang · Role-play. Choose what you’d say.', '<button class="band-btn" data-act="mamak-exit" aria-label="Close role-play">✕</button>', true) + `<main class="sheet">
    <div class="chat">${lines.join('')}</div>
    ${finished ? `<div class="done-box"><div class="eyebrow">Order complete</div><div class="h">${m.firstTry} / ${MAMAK.length}</div><div class="muted" style="font-weight:600">right on the first try</div><button class="btn btn-ink" data-act="mamak">Order again</button><button class="btn btn-line" data-act="mamak-exit">Back</button></div>`
      : `<div class="replies">${shuffleFixed(cur.replies, m.step).map(([t, ok]) => `<button class="reply ${m.wrong.includes(t) ? 'wrong' : ''}" data-reply="${esc(t)}">${esc(t)}</button>`).join('')}</div>
         ${m.wrong.length ? `<div class="msg note">✗ ${esc(cur.replies.find(r => r[0] === m.wrong[m.wrong.length - 1])[2])}</div>` : ''}`}
  </main>`;
}
const shuffleFixed = (arr, seed) => [...arr].sort((a, b) => ((a[0].length * 7 + seed) % 5) - ((b[0].length * 7 + seed) % 5));

// ═══════════ RENDER ═══════════
function render() {
  const v = $('#view');
  if (st.mamak) v.innerHTML = Mamak();
  else v.innerHTML = { home: Home, learn: Learn, garden: Garden, map: MapView, shop: Shop }[st.tab]();
  renderDock();
  if (st.tab === 'learn' && !st.mamak) bindSwipe();
}
function go(tab) { st.tab = tab; st.mamak = null; render(); window.scrollTo(0, 0); }

function sort(known) {
  const top = $('#top'); if (!top) return;
  st.marks[st.i] = !!known;
  top.style.transition = 'transform .35s ease, opacity .35s';
  top.style.transform = `translateX(${known ? 520 : -520}px) rotate(${known ? 24 : -24}deg)`;
  top.style.opacity = '0';
  if (!known) { const id = st.deck[st.i].id; if (!st.garden.some(g => g.id === id)) st.garden.push({ id, stage: 0, due: true }); }
  setTimeout(() => { st.i++; st.flipped = false; render(); }, 280);
}
function bindSwipe() {
  const top = $('#top'); if (!top) return;
  let x0 = null, dx = 0, moved = false;
  const yes = top.querySelector('.stamp-yes'), no = top.querySelector('.stamp-no');
  top.addEventListener('pointerdown', e => { if (e.target.closest('[data-act]')) return; x0 = e.clientX; dx = 0; moved = false; top.setPointerCapture(e.pointerId); top.classList.add('dragging'); });
  top.addEventListener('pointermove', e => {
    if (x0 == null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true;
    top.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (x0 == null) return; x0 = null; top.classList.remove('dragging');
    if (Math.abs(dx) > 90) return sort(dx > 0);
    top.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
    if (!moved) { st.flipped = !st.flipped; top.classList.toggle('flipped', st.flipped); }
  };
  top.addEventListener('pointerup', end); top.addEventListener('pointercancel', end);
  top.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); st.flipped = !st.flipped; top.classList.toggle('flipped', st.flipped); }
    if (e.key === 'ArrowRight') sort(true); if (e.key === 'ArrowLeft') sort(false);
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-act],[data-topic],[data-front],[data-pre],[data-root],[data-suf],[data-stop],[data-step],[data-opt],[data-reply]');
  if (!el) return;
  const d = el.dataset;
  if (d.tab) return go(d.tab);
  if (d.topic) { st.topic = d.topic; newDeck(); return render(); }
  if (d.front) { st.front = d.front; st.flipped = false; return render(); }
  if (d.pre !== undefined || d.root !== undefined || d.suf !== undefined) {
    if (d.pre !== undefined) st.pre = d.pre; if (d.root !== undefined) st.root = d.root; if (d.suf !== undefined) st.suf = d.suf;
    const key = `${st.pre}|${st.root}|${st.suf}`;
    st.lastNew = !!FORMS[key] && !st.found.has(key); if (FORMS[key]) st.found.add(key);
    return render();
  }
  if (d.stop) { st.stop = +d.stop; return render(); }
  if (d.step) { const k = +d.step; if (k === 2) return startMamak(); if (k === 1) return go('learn'); return toast(k === 0 ? 'Listening drill: next build' : 'Checkpoint: next build'); }
  if (d.opt) { const w = st.watering, word = byId(w.g.id); w.pick = +d.opt; w.ok = w.opts[w.pick].id === word.id; if (w.ok) w.g.stage = Math.min(4, w.g.stage + 1); w.g.due = false; return render(); }
  if (d.reply) { const m = st.mamak, cur = MAMAK[m.step], r = cur.replies.find(x => x[0] === d.reply); if (r[1]) { if (!m.wrong.length) m.firstTry++; m.answers[m.step] = r; m.step++; m.wrong = []; } else if (!m.wrong.includes(r[0])) m.wrong.push(r[0]); render(); if (r[1]) speak(r[0]); return; }
  switch (d.act) {
    case 'speak': e.stopPropagation(); return speak(d.say);
    case 'flip': { const t = $('#top'); if (t) { st.flipped = !st.flipped; t.classList.toggle('flipped', st.flipped); } return; }
    case 'sort': return sort(d.v === '1');
    case 'redeal': newDeck(); return render();
    case 'water': { const q = st.garden.filter(g => g.due); st.watering = { list: q, total: q.length, done: 0 }; setWater(); return render(); }
    case 'water-next': { const w = st.watering; w.done++; if (w.done >= w.total) { st.watering = null; toast('Kebun disiram. The garden is watered.'); } else setWater(); render(); return window.scrollTo(0, 0); }
    case 'mamak': return startMamak();
    case 'mamak-exit': st.mamak = null; render(); return window.scrollTo(0, 0);
    case 'theme': { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; return; }
  }
});
function setWater() { const w = st.watering; w.g = w.list[w.done]; const word = byId(w.g.id); w.opts = shuffle([word, ...shuffle(WORDS.filter(x => x.id !== word.id)).slice(0, 2)]); w.pick = null; w.ok = null; }
function startMamak() { st.mamak = { step: 0, answers: {}, wrong: [], firstTry: 0 }; render(); window.scrollTo(0, 0); speak(MAMAK[0].them); }
try { speechSynthesis.getVoices(); } catch {}
render();
</script>
