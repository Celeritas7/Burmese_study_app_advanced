<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belajar Melayu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width column (max 440px) with a fixed bottom tab bar — mirrors the Burmese app shell.
   Dark-only by design, matching the existing app's tokens. */
:root {
  color-scheme: dark;
  --bg: #131F24;
  --surface: #1A2C33;
  --elevated: #0F1A1F;
  --border: #1E2D33;
  --border-light: #2A3A42;
  --text: #EAEEF3;
  --text-muted: #6A8A98;
  --text-dim: #3A5060;
  --blue: #1CB0F6;
  --green: #58CC02;
  --yellow: #FFC800;
  --pink: #FF6B8A;
  --purple: #CE82FF;
  --orange: #FF9600;
  --red: #FF4B4B;
  --card-bg: linear-gradient(150deg, #FFFCF0, #FFF3D6);
  --card-border: #E5C07B;
  --card-text: #1A1612;
  --card-sub: rgba(26,22,18,0.5);
  --on-accent: #131F24;
  --radius: 14px;
  --font: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --jawi: 'Noto Naskh Arabic', 'Geeza Pro', 'Arial', serif;
  /* affix colours (Imbuhan) */
  --pre: #1CB0F6;
  --root: #58CC02;
  --suf: #FF9600;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
button { font-family: var(--font); color: inherit; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; position: relative; }
.content { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.pad { padding: 18px 16px; }
.pad-sm { padding: 12px 16px; }
.muted { color: var(--text-muted); }
.jawi { font-family: var(--jawi); direction: rtl; }
.section-label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 9px; color: var(--text-muted); }
.proto-chip { display: inline-block; font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: rgba(255,200,0,0.12); color: var(--yellow); }

/* ═══ TAB BAR ═══ */
.tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 440px; background: var(--elevated); border-top: 2px solid var(--border); z-index: 50; display: flex; justify-content: space-around; padding: 8px 4px calc(12px + env(safe-area-inset-bottom, 0px)); }
.tab-btn { background: none; border: 2px solid transparent; border-radius: var(--radius); padding: 5px 0; width: 62px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tab-icon { font-size: 18px; }
.tab-label { font-size: 10px; font-weight: 800; color: var(--text-muted); }
.tab-btn.active { background: rgba(28,176,246,0.08); border-color: rgba(28,176,246,0.2); }
.tab-btn.active .tab-label { color: var(--blue); }

/* ═══ HOME ═══ */
.home { position: relative; overflow: hidden; min-height: calc(100vh - 90px); }
.home-header { position: relative; display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; }
.home-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--yellow); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: var(--on-accent); }
.home-brand { font-size: 17px; font-weight: 900; flex: 1; }
.pill-btn { display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 12px; background: var(--surface); border: 2px solid var(--border); font-size: 12px; font-weight: 800; cursor: pointer; }
.home-wm { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.home-wm span { position: absolute; font-family: var(--jawi); font-weight: 700; line-height: 1; color: var(--focus); opacity: 0.07; }
.home-hero { position: relative; padding: 18px 22px 10px; }
.home-done { font-size: 13px; font-weight: 800; color: var(--green); margin-bottom: 14px; }
.home-glyph { min-width: 88px; height: 88px; padding: 0 14px; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: var(--focus); margin-bottom: 14px; background: color-mix(in srgb, var(--focus) 16%, var(--surface)); border: 2px solid color-mix(in srgb, var(--focus) 35%, transparent); box-shadow: 0 0 40px color-mix(in srgb, var(--focus) 18%, transparent); }
.home-focus-label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; color: var(--focus); margin-bottom: 6px; }
.home-title { font-size: 34px; font-weight: 900; letter-spacing: -0.8px; line-height: 1.05; margin-bottom: 8px; text-wrap: balance; }
.home-sub { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.home-meta { font-size: 13px; color: var(--text-muted); font-weight: 700; }
.home-start { display: flex; align-items: center; gap: 16px; margin-top: 22px; background: none; border: none; cursor: pointer; padding: 0; }
.home-play { width: 64px; height: 64px; border-radius: 50%; background: var(--focus); display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--on-accent); padding-left: 5px; box-shadow: 0 0 30px color-mix(in srgb, var(--focus) 50%, transparent); }
.home-start-label { font-size: 19px; font-weight: 900; }
.wotd { position: relative; margin: 26px 16px 0; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); display: flex; gap: 14px; align-items: center; cursor: pointer; text-align: left; width: calc(100% - 32px); }
.wotd-jawi { font-size: 30px; color: var(--yellow); min-width: 64px; text-align: center; }
.wotd-word { font-size: 20px; font-weight: 900; }
.wotd-mean { font-size: 13px; color: var(--text-muted); font-weight: 700; }
.streak-row { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 14px 16px 0; }
.streak-day { text-align: center; font-size: 10px; font-weight: 800; color: var(--text-muted); }
.streak-dot { height: 30px; border-radius: 9px; margin-top: 4px; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; }
.streak-dot.on { background: rgba(255,150,0,0.16); border-color: rgba(255,150,0,0.5); }

/* ═══ STUDY SETUP ═══ */
.setup-header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.setup-back { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); font-size: 18px; cursor: pointer; }
.setup-h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.3px; }
.setup-h2 { font-size: 13px; color: var(--blue); font-weight: 700; }
.test-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
.test-card { padding: 16px 2px 12px; border-radius: 16px; text-align: center; cursor: pointer; background: var(--surface); border: 2px solid var(--border); }
.test-card.active { background: var(--blue); border-color: var(--blue); }
.tc-glyph { font-size: 22px; font-weight: 900; line-height: 1.1; height: 28px; display: flex; align-items: center; justify-content: center; }
.tc-label { font-size: 11px; font-weight: 800; margin-top: 8px; color: var(--text-muted); }
.test-card.active .tc-glyph, .test-card.active .tc-label { color: #fff; }
.num-row { display: flex; gap: 7px; margin-bottom: 22px; }
.num-btn { flex: 1; padding: 10px 0; border-radius: 12px; background: var(--surface); border: 2px solid var(--border); color: var(--text-muted); font-size: 15px; font-weight: 800; cursor: pointer; }
.num-btn.active { background: rgba(28,176,246,0.08); border-color: var(--blue); color: var(--blue); }
.source-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); cursor: pointer; text-align: left; margin-bottom: 10px; }
.source-card.active { border-color: var(--c); }
.sc-badge { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; background: var(--c); }
.sc-name { font-size: 16px; font-weight: 900; }
.sc-avail { font-size: 12px; color: var(--text-muted); font-weight: 700; }
.sc-count { min-width: 50px; padding: 11px 8px; border-radius: 12px; background: var(--bg); text-align: center; font-size: 18px; font-weight: 900; }
.source-card.active .sc-count { color: var(--c); }
.btn-primary { width: 100%; padding: 15px; background: var(--blue); color: var(--on-accent); border: none; border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 900; margin-top: 8px; }
.btn-primary:active { opacity: 0.85; }

/* ═══ FLASHCARD ═══ */
.fc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.fc-title { font-size: 13px; font-weight: 800; }
.fc-title span { color: var(--text-muted); font-size: 12px; margin-left: 4px; }
.fc-close { color: var(--text-muted); font-size: 16px; background: none; border: none; cursor: pointer; padding: 4px; }
.fc-counter { text-align: center; font-size: 12px; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; }
.mode-row { display: flex; gap: 5px; justify-content: center; margin-bottom: 12px; flex-wrap: wrap; }
.mode-btn { padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; border: 2px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; }
.mode-btn.active { border-color: var(--blue); background: rgba(28,176,246,0.08); color: var(--blue); }
.word-card { position: relative; background: var(--card-bg); border-radius: 18px; padding: 30px 18px 22px; text-align: center; margin-bottom: 12px; border: 3px solid var(--card-border); }
.word-card-text { font-size: 40px; font-weight: 900; color: var(--card-text); line-height: 1.15; overflow-wrap: anywhere; }
.word-card-text.jawi { font-size: 46px; line-height: 1.5; }
.word-card-sub { font-size: 14px; color: var(--card-sub); margin-top: 8px; font-weight: 700; }
.reg-badge { position: absolute; top: 10px; left: 12px; font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 7px; background: rgba(255,150,0,0.18); color: #A35A00; }
.speak-btn { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--card-border); background: rgba(255,255,255,0.6); cursor: pointer; font-size: 16px; color: var(--card-text); }
.reveal-box { background: var(--surface); border-radius: 16px; padding: 16px 18px; margin-bottom: 12px; border: 2px solid var(--border); min-height: 80px; cursor: pointer; width: 100%; text-align: left; display: block; }
.reveal-placeholder { text-align: center; padding: 22px 0; font-size: 14px; color: var(--text-muted); font-weight: 700; }
.reveal-layer { margin-bottom: 13px; animation: fadeSlide .25s ease; }
.reveal-layer:last-child { margin-bottom: 0; }
.reveal-label { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.reveal-bar { width: 4px; height: 14px; border-radius: 2px; }
.reveal-value { padding-left: 10px; line-height: 1.5; font-weight: 700; }
.reveal-more { text-align: center; font-size: 12px; color: var(--text-muted); padding-top: 4px; font-weight: 700; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.syl b { color: var(--yellow); }
.parts { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.part { padding: 2px 7px; border-radius: 7px; font-weight: 900; font-size: 15px; }
.part.pre { background: rgba(28,176,246,0.15); color: var(--pre); }
.part.root { background: rgba(88,204,2,0.15); color: var(--root); }
.part.suf { background: rgba(255,150,0,0.15); color: var(--suf); }
.plus { color: var(--text-dim); font-weight: 900; }
.action-row { display: flex; gap: 7px; margin-bottom: 12px; }
.btn-story { flex: 1; padding: 12px; border-radius: var(--radius); background: var(--purple); font-size: 13px; font-weight: 900; color: var(--on-accent); border: none; cursor: pointer; }
.btn-action { width: 46px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--border); font-size: 16px; cursor: pointer; }
.rating-title { text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
.rating-row { display: flex; justify-content: center; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
.rate { width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; background: color-mix(in srgb, var(--rc) 10%, transparent); border: 2px solid var(--border); color: var(--rc); }
.rate.nope { border-radius: 12px; background: rgba(255,75,75,0.15); border-color: rgba(255,75,75,0.4); }
.rate.active { background: var(--rc); border-color: var(--rc); color: #fff; }
.nav-row { display: flex; gap: 7px; margin-bottom: 8px; }
.btn-nav { flex: 1; padding: 13px; border-radius: var(--radius); font-size: 14px; font-weight: 800; cursor: pointer; border: none; }
.btn-prev { background: var(--surface); border: 2px solid var(--border); }
.btn-prev:disabled { color: var(--text-dim); cursor: not-allowed; }
.btn-shuffle { flex: none; width: 52px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--border); font-size: 20px; cursor: pointer; }
.btn-next { background: var(--blue); color: var(--on-accent); font-weight: 900; }
.progress-bar { height: 5px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width .4s ease; }

/* ═══ RESULTS ═══ */
.res-hero { text-align: center; padding: 30px 0 18px; }
.res-big { font-size: 56px; font-weight: 900; color: var(--green); line-height: 1; }
.res-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.tile { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 14px 6px; text-align: center; }
.tile-num { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.tile-label { font-size: 10px; color: var(--text-muted); font-weight: 800; margin-top: 3px; letter-spacing: .5px; text-transform: uppercase; }

/* ═══ SRS ═══ */
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 2px solid var(--border); margin-bottom: 7px; }
.srs-dot { width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; }
.srs-word { font-size: 16px; font-weight: 900; }
.srs-meaning { font-size: 12px; color: var(--text-muted); font-weight: 700; }
.srs-due { font-size: 12px; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.lvl { display: flex; gap: 3px; margin-top: 5px; justify-content: flex-end; }
.lvl i { width: 6px; height: 6px; border-radius: 3px; background: var(--border-light); }
.lvl i.on { background: var(--yellow); }
.srs-resp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.srs-resp button { padding: 12px 4px; border-radius: 14px; border: 2px solid var(--rc); background: color-mix(in srgb, var(--rc) 12%, transparent); color: var(--rc); font-weight: 900; font-size: 13px; cursor: pointer; }
.srs-resp small { display: block; font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* ═══ COURSE ═══ */
.unit { display: flex; gap: 14px; align-items: center; width: 100%; padding: 14px; border-radius: 18px; background: var(--surface); border: 2px solid var(--border); margin-bottom: 10px; cursor: pointer; text-align: left; }
.unit.current { border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(255,200,0,0.08); }
.unit.locked { opacity: .45; cursor: not-allowed; }
.unit-num { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; flex-shrink: 0; background: var(--bg); border: 3px solid var(--border-light); }
.unit.done .unit-num { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.unit.current .unit-num { border-color: var(--yellow); color: var(--yellow); }
.unit-title { font-size: 16px; font-weight: 900; }
.unit-sub { font-size: 12px; color: var(--text-muted); font-weight: 700; }
.unit-bar { height: 5px; background: var(--bg); border-radius: 3px; margin-top: 7px; overflow: hidden; }
.unit-bar i { display: block; height: 100%; background: var(--green); }
.step { display: flex; gap: 12px; align-items: center; width: 100%; padding: 13px 14px; border-radius: 14px; background: var(--surface); border: 2px solid var(--border); margin-bottom: 8px; cursor: pointer; text-align: left; }
.step-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: color-mix(in srgb, var(--sc) 18%, var(--bg)); flex-shrink: 0; }
.step-check { margin-left: auto; font-weight: 900; color: var(--green); }

/* ═══ GROUPS (Imbuhan word tree) ═══ */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.legend .part { font-size: 11px; }
.root-tabs { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: none; }
.root-tab { flex: none; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 2px solid var(--border); font-weight: 900; font-size: 14px; cursor: pointer; color: var(--text-muted); }
.root-tab.active { border-color: var(--green); color: var(--green); background: rgba(88,204,2,0.08); }
.wt-card { padding: 8px 2px 12px; background: var(--surface); border: 2px solid var(--border); border-radius: 18px; margin-bottom: 12px; }
.wt-scroll { overflow-x: auto; padding-bottom: 4px; }
.wt-tree { display: inline-block; min-width: 100%; padding: 8px 10px 2px; text-align: center; }
.wt-tree ul { display: flex; justify-content: center; padding-top: 18px; position: relative; list-style: none; }
.wt-tree li { list-style: none; position: relative; padding: 18px 4px 0; text-align: center; }
.wt-tree li::before, .wt-tree li::after { content: ''; position: absolute; top: 0; right: 50%; width: 50%; height: 18px; border-top: 2px solid var(--border-light); }
.wt-tree li::after { right: auto; left: 50%; border-left: 2px solid var(--border-light); }
.wt-tree li:first-child::before { border: 0; }
.wt-tree li:last-child::after { border: 0; }
.wt-tree li:last-child::before { border-right: 2px solid var(--border-light); border-radius: 0 7px 0 0; }
.wt-tree li:first-child::after { border-left: 2px solid var(--border-light); border-radius: 7px 0 0 0; }
.wt-tree li:only-child::before, .wt-tree li:only-child::after { display: none; }
.wt-tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--border-light); height: 18px; }
.wt-tree > ul, .wt-tree > ul > li { padding-top: 0; }
.wt-tree > ul > li::before, .wt-tree > ul > li::after { display: none; }
.wt-node { display: inline-flex; flex-direction: column; align-items: center; border-radius: 12px; cursor: pointer; background: var(--bg); padding: 8px 9px; min-width: 64px; border: 2px solid var(--border-light); }
.wt-hub { background: rgba(88,204,2,0.10); border-color: rgba(88,204,2,0.55); padding: 10px 16px; }
.wt-hub .wt-w { color: var(--green); font-size: 22px; font-weight: 900; }
.wt-w { font-size: 14px; font-weight: 900; white-space: nowrap; }
.wt-w .p { color: var(--pre); } .wt-w .r { color: var(--text); } .wt-w .s { color: var(--suf); }
.wt-mean { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-top: 3px; white-space: nowrap; }
.wt-detail { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border-light); font-size: 11px; max-width: 150px; white-space: normal; line-height: 1.35; font-weight: 700; }
.wt-node.open .wt-detail { display: block; }
.wt-node.open { border-color: var(--purple); }
.fam-list .list-item { gap: 10px; }

/* ═══ MORE ═══ */
.more-item { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 14px; border-radius: 16px; background: var(--surface); border: 2px solid var(--border); margin-bottom: 8px; cursor: pointer; text-align: left; }
.more-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; background: color-mix(in srgb, var(--c) 18%, var(--bg)); flex-shrink: 0; }
.more-label { font-size: 15px; font-weight: 900; }
.more-desc { font-size: 12px; color: var(--text-muted); font-weight: 700; }
.more-arrow { margin-left: auto; color: var(--text-muted); font-weight: 900; }

/* ═══ QUIZ ═══ */
.q-prompt { font-size: 13px; color: var(--text-muted); font-weight: 800; text-align: center; margin-bottom: 8px; }
.q-opts { display: grid; gap: 8px; }
.q-opt { padding: 15px; border-radius: 14px; background: var(--surface); border: 2px solid var(--border); font-size: 16px; font-weight: 800; cursor: pointer; text-align: left; }
.q-opt.right { border-color: var(--green); background: rgba(88,204,2,0.12); color: var(--green); }
.q-opt.wrong { border-color: var(--red); background: rgba(255,75,75,0.12); color: var(--red); }

/* ═══ DIALOGUE ═══ */
.bubble { max-width: 82%; padding: 11px 14px; border-radius: 16px; margin-bottom: 8px; background: var(--surface); border: 2px solid var(--border); }
.bubble.b { margin-left: auto; background: rgba(28,176,246,0.10); border-color: rgba(28,176,246,0.3); }
.bubble .who { font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
.bubble .ms { font-size: 16px; font-weight: 800; }
.bubble .en { font-size: 12px; color: var(--text-muted); font-weight: 700; margin-top: 3px; }

/* ═══ SETTINGS ═══ */
.toggle-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); border: 2px solid var(--border); margin-bottom: 8px; }
.switch { margin-left: auto; width: 46px; height: 26px; border-radius: 13px; background: var(--border-light); border: none; position: relative; cursor: pointer; flex-shrink: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: left .2s; }
.switch.on { background: var(--green); }
.switch.on::after { left: 23px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; font-weight: 800; }
.bar-row .track { flex: 1; height: 10px; background: var(--surface); border-radius: 5px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 5px; }
.bar-row .n { width: 42px; text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* ═══ MODAL / TOAST ═══ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { width: 100%; max-width: 380px; background: var(--surface); border-radius: 20px; padding: 20px; border: 2px solid var(--border); max-height: 80vh; overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-title { font-size: 16px; font-weight: 900; }
.modal-close { font-size: 12px; color: var(--text-muted); background: var(--bg); padding: 5px 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 800; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--elevated); border: 2px solid var(--border-light); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 800; z-index: 120; max-width: 90%; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find(v => /^ms/i.test(v.lang)) || voices.find(v => /^id/i.test(v.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : 'ms-MY'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch { toast('Audio isn’t available in this browser'); }

function toast(msg) {

      <div class="wotd-word">${esc(w.ms)} <span style="font-size:14px">🔊</span></div><div class="wotd-mean">${esc(w.en)}</div></div>
    </button>
  </div>`;
}

function StudySetup() {
  const count = id => WORDS.filter(w => w.src === id).length;
  return `<div class="pad">
    <div class="setup-header">
      <button class="setup-back" data-tab="home" aria-label="Back">‹</button>
      <div><div class="setup-h1">Study session</div><div class="setup-h2">Set up your session</div></div>
    </div>
    <div class="section-label">Card front</div>
    <div class="test-grid">${MODES.map(m => `<button class="test-card ${S.mode === m.id ? 'active' : ''}" data-mode="${m.id}"><div class="tc-glyph ${m.id === 'jawi' ? 'jawi' : ''}">${m.glyph}</div><div class="tc-label">${m.label}</div></button>`).join('')}</div>
    <div class="section-label">Words per session</div>
    <div class="num-row">${[5, 10, 15, 20, 30].map(n => `<button class="num-btn ${S.perSession === n ? 'active' : ''}" data-num="${n}">${n}</button>`).join('')}</div>
    <div class="section-label">Source</div>
    ${SOURCES.map(s => `<button class="source-card ${S.source === s.id ? 'active' : ''}" data-source="${s.id}" style="--c:${s.color}">
      <div class="sc-badge">${s.icon}</div>
      <div class="flex-1" style="flex:1;min-width:0"><div class="sc-name">${s.name}</div><div class="sc-avail">${count(s.id)} words available</div></div>
      <div class="sc-count">${count(s.id)}</div></button>`).join('')}
    <button class="btn-primary" data-action="start" style="background:var(--green)">▶ Start Session</button>
    <button class="btn-primary" data-action="quiz" style="background:var(--purple)">🧠 Quiz Mode →</button>
  </div>`;
}

function revealLayers(w) {
  const L = [];
  if (S.mode !== 'en') L.push(['Meaning', 'var(--blue)', `<span style="font-size:18px">${esc(w.en)}</span>`]);
  if (S.mode !== 'ms') L.push(['Rumi · Malay', 'var(--green)', `<span style="font-size:20px;font-weight:900">${esc(w.ms)}</span>`]);
  L.push(['Sebutan · Syllables', 'var(--yellow)', `<span class="syl" style="font-size:17px">${esc(w.syl).replace(/·/g, '<b>·</b>')}</span> <span class="muted" style="font-size:12px">— stress is light; every vowel is clear</span>`]);
  L.push(['Imbuhan · Root + affix', 'var(--orange)', `<span class="parts">${partsOf(w).map(([t, k]) => `<span class="part ${k}">${esc(k === 'pre' ? t + '-' : k === 'suf' ? '-' + t : t)}</span>`).join('<span class="plus">+</span>')}</span>${w.parts ? '' : ' <span class="muted" style="font-size:12px">base word, no affixes</span>'}`]);
  if (S.settings.jawi && S.mode !== 'jawi') L.push(['Jawi', 'var(--purple)', `<span class="jawi" style="font-size:26px">${w.jawi}</span>`]);
  L.push(['Contoh · Example', 'var(--pink)', `${esc(w.ex)}<div class="muted" style="font-size:13px">${esc(w.exEn)}</div>${w.note && S.settings.colloquial ? `<div style="font-size:12px;color:var(--yellow);margin-top:4px">💡 ${esc(w.note)}</div>` : ''}`]);
  return L;
}

function Session() {
  const w = S.session[S.idx];
  const total = S.session.length;
  const layers = revealLayers(w);
  let front, cls = '';
  if (S.mode === 'en') front = esc(w.en);
  else if (S.mode === 'jawi') { front = w.jawi; cls = 'jawi'; }
  else if (S.mode === 'listen') front = '🔊';
  else front = esc(w.ms);
  const shown = layers.slice(0, S.reveal);
  const r = S.ratings[w.id];
  return `<div class="pad-sm">
    <div class="fc-top"><div class="fc-title">📖 ${esc(srcOf(w.src).name)}</div><button class="fc-close" data-action="end" aria-label="End session">✕</button></div>
    <div class="fc-counter">${S.idx + 1} / ${total}</div>
    <div class="mode-row">${MODES.map(m => `<button class="mode-btn ${S.mode === m.id ? 'active' : ''}" data-mode="${m.id}"><span class="${m.id === 'jawi' ? 'jawi' : ''}">${m.glyph}</span>${S.mode === m.id ? ' ' + m.label : ''}</button>`).join('')}</div>
    <div class="word-card">
      ${w.reg ? `<span class="reg-badge">${w.reg}</span>` : ''}
      <button class="speak-btn" data-action="speak" data-text="${esc(w.ms)}" aria-label="Play pronunciation">🔊</button>
      <div class="word-card-text ${cls}" style="${S.mode === 'en' ? 'font-size:26px' : S.mode === 'listen' ? 'font-size:52px;cursor:pointer' : ''}" ${S.mode === 'listen' ? `data-action="speak" data-text="${esc(w.ms)}"` : ''}>${front}</div>
      ${S.mode === 'listen' ? '<div class="word-card-sub">Tap to hear it again</div>' : ''}
    </div>
    <button class="reveal-box" data-action="reveal">
      ${shown.length === 0 ? '<div class="reveal-placeholder">Tap to reveal 👆</div>' :
        shown.map(([lb, c, v]) => `<div class="reveal-layer"><div class="reveal-label" style="color:${c}"><span class="reveal-bar" style="background:${c}"></span>${lb}</div><div class="reveal-value">${v}</div></div>`).join('') +
        (S.reveal < layers.length ? `<div class="reveal-more">Tap for more · ${layers.length - S.reveal} left</div>` : '')}
    </button>
    <div class="action-row">
      <button class="btn-story" data-action="story">📝 My Story</button>
      <button class="btn-story" style="background:var(--green)" data-action="family" data-id="${w.id}">🌳 Family</button>
      <button class="btn-action" data-action="toast" data-msg="Edit word — coming in the full build" aria-label="Edit">✏️</button>
      <button class="btn-action" data-action="toast" data-msg="Flagged for review" aria-label="Flag">🚩</button>
    </div>
    <div class="rating-title">Rate this word</div>
    <div class="rating-row">${RATING_ORDER.map(i => { const rt = RATINGS[i]; return `<button class="rate ${i === 5 ? 'nope' : ''} ${r === i ? 'active' : ''}" style="--rc:${rt.color}" data-rate="${i}" title="${rt.label}" aria-label="${rt.label}">${rt.icon}</button>`; }).join('')}</div>
    <div class="nav-row">
      <button class="btn-nav btn-prev" data-action="prev" ${S.idx === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn-shuffle" data-action="shuffle" aria-label="Shuffle">🎲</button>
      <button class="btn-nav btn-next" data-action="next">${S.idx === total - 1 ? 'Finish ✓' : 'Next →'}</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(S.idx + 1) / total * 100}%"></div></div>
  </div>`;
}

function Results() {
  const vals = S.session.map(w => S.ratings[w.id]);
  const good = vals.filter(v => [1, 3, 6].includes(v)).length;
  const fuzzy = vals.filter(v => [2, 4].includes(v)).length;
  const nope = vals.filter(v => v === 5).length;
  return `<div class="pad">
    <div class="res-hero"><div style="font-size:44px">🎉</div><div class="res-big">${good}/${S.session.length}</div><div style="font-weight:900;font-size:18px;margin-top:8px">Bagus! Session complete</div><div class="muted" style="font-weight:700;font-size:13px">${esc(srcOf(S.source).name)}</div></div>
    <div class="res-grid"><div class="tile"><div class="tile-num" style="color:var(--green)">${good}</div><div class="tile-label">Known</div></div><div class="tile"><div class="tile-num" style="color:var(--purple)">${fuzzy}</div><div class="tile-label">Fuzzy</div></div><div class="tile"><div class="tile-num" style="color:var(--red)">${nope}</div><div class="tile-label">Nope</div></div></div>
    <div class="section-label">Added to SRS</div>
    ${S.session.slice(0, 6).map(w => `<div class="list-item"><div class="srs-dot" style="background:${RATINGS[S.ratings[w.id] ?? 0].color}"></div><div style="flex:1"><div class="srs-word">${esc(w.ms)}</div><div class="srs-meaning">${esc(w.en)}</div></div><div class="jawi muted" style="font-size:18px">${w.jawi}</div></div>`).join('')}
    <button class="btn-primary" data-action="start" style="background:var(--green)">↻ Study again</button>
    <button class="btn-primary" data-tab="srs" style="background:var(--surface);color:var(--text);border:2px solid var(--border)">Go to reviews →</button>
  </div>`;
}

function SRS() {
  if (S.view === 'review') return SRSReview();
  const due = S.srsQueue.filter(q => q.due === 'Now').length;
  return `<div class="pad">
    <div class="setup-header"><div><div class="setup-h1">Ulang kaji · Review</div><div class="setup-h2">Spaced repetition</div></div></div>
    <div class="res-grid" style="margin-top:0"><div class="tile"><div class="tile-num" style="color:var(--pink)">${due}</div><div class="tile-label">Due now</div></div><div class="tile"><div class="tile-num" style="color:var(--blue)">${S.srsQueue.length}</div><div class="tile-label">Learning</div></div><div class="tile"><div class="tile-num" style="color:var(--yellow)">42</div><div class="tile-label">Mastered</div></div></div>
    <button class="btn-primary" data-action="srs-start" style="background:var(--pink);margin-bottom:20px" ${due ? '' : 'disabled'}>▶ Review ${due} due cards</button>
    <div class="section-label">Queue</div>
    ${S.srsQueue.map(q => { const w = wordById(q.id); const now = q.due === 'Now'; return `<div class="list-item"><div class="srs-dot" style="background:${now ? 'var(--pink)' : 'var(--border-light)'}"></div><div style="flex:1;min-width:0"><div class="srs-word">${esc(w.ms)}</div><div class="srs-meaning">${esc(w.en)}</div></div><div><div class="srs-due" style="color:${now ? 'var(--pink)' : 'var(--text-muted)'}">${q.due}</div><div class="lvl">${Array.from({ length: 7 }, (_, i) => `<i class="${i < q.lvl ? 'on' : ''}"></i>`).join('')}</div></div></div>`; }).join('')}
  </div>`;
}

function SRSReview() {
  const due = S.srsQueue.filter(q => q.due === 'Now');
  const q = due[0];
  if (!q) return `<div class="pad"><div class="res-hero"><div style="font-size:44px">✅</div><div class="res-big">${S.srsDone}</div><div style="font-weight:900;font-size:18px;margin-top:8px">All caught up!</div><div class="muted" style="font-weight:700">Next review in 2 hours</div></div><button class="btn-primary" data-action="srs-exit">Back to queue</button></div>`;
  const w = wordById(q.id);
  return `<div class="pad-sm">
    <div class="fc-top"><div class="fc-title">🔄 Review</div><button class="fc-close" data-action="srs-exit" aria-label="Exit review">✕</button></div>
    <div class="fc-counter">${due.length} left</div>
    <div class="word-card"><button class="speak-btn" data-action="speak" data-text="${esc(w.ms)}" aria-label="Play">🔊</button><div class="word-card-text">${esc(w.ms)}</div>${S.srsReveal ? `<div class="word-card-sub">${esc(w.syl)}</div>` : ''}</div>
    ${S.srsReveal ? `<div class="reveal-box" style="cursor:default"><div class="reveal-layer"><div class="reveal-label" style="color:var(--blue)"><span class="reveal-bar" style="background:var(--blue)"></span>Meaning</div><div class="reveal-value" style="font-size:18px">${esc(w.en)}</div></div><div class="reveal-layer"><div class="reveal-label" style="color:var(--pink)"><span class="reveal-bar" style="background:var(--pink)"></span>Contoh</div><div class="reveal-value">${esc(w.ex)}<div class="muted" style="font-size:13px">${esc(w.exEn)}</div></div></div></div>
      <div class="srs-resp">${SRS_RESP.map((r, i) => `<button style="--rc:${r.color}" data-srs="${i}">${r.label}<small>${r.next}</small></button>`).join('')}</div>`
    : `<button class="btn-primary" data-action="srs-show">Show answer</button>`}
  </div>`;
}

function Course() {
  if (S.openUnit) {
    const u = UNITS.find(u => u.n === S.openUnit);
    return `<div class="pad">
      <div class="setup-header"><button class="setup-back" data-action="unit-close" aria-label="Back">‹</button><div><div class="setup-h1">Unit ${u.n}: ${u.title}</div><div class="setup-h2">${u.en}</div></div></div>
      ${UNIT_STEPS.map((s, i) => `<button class="step" style="--sc:${s.c}" data-step="${s.key}"><div class="step-icon">${s.icon}</div><div><div class="more-label">${s.label}</div><div class="more-desc">${s.desc}</div></div><div class="step-check">${i < u.done ? '✓' : '›'}</div></button>`).join('')}
      <div class="section-label" style="margin-top:18px">You’ll be able to</div>
      <div class="list-item" style="display:block;font-weight:700;font-size:14px;line-height:1.7">☐ Order a meal and a drink at a mamak stall<br>☐ Ask for less sugar / less spice<br>☐ Ask how much it costs and understand the answer</div>
    </div>`;
  }
  const cur = UNITS.find(u => u.done < u.steps);
  return `<div class="pad">
    <div class="setup-header"><div><div class="setup-h1">Kursus · Course</div><div class="setup-h2">Conversational Malay A1 → A2</div></div></div>
    ${UNITS.map(u => { const done = u.done === u.steps, current = u === cur, locked = !done && !current; return `<button class="unit ${done ? 'done' : ''} ${current ? 'current' : ''} ${locked ? 'locked' : ''}" data-unit="${u.n}" ${locked ? 'aria-disabled="true"' : ''}><div class="unit-num">${done ? '✓' : locked ? '🔒' : u.n}</div><div style="flex:1;min-width:0"><div class="unit-title">${u.title}</div><div class="unit-sub">${u.en} · ${u.done}/${u.steps} steps</div><div class="unit-bar"><i style="width:${u.done / u.steps * 100}%"></i></div></div></button>`; }).join('')}
  </div>`;
}

function famWord(parts) { return parts.map(([t, k]) => `<span class="${k[0] === 'p' ? 'p' : k[0] === 'r' ? 'r' : 's'}">${esc(t)}</span>`).join(''); }
function Groups() {
  const f = FAMILIES.find(f => f.root === S.root);
  return `<div class="pad">
    <div class="setup-header"><div><div class="setup-h1">Imbuhan · Word families</div><div class="setup-h2">One root, many words</div></div></div>
    <div class="legend">${AFFIXES.map(([a, k, d]) => `<span class="part ${k}" title="${d}">${a} <span style="font-weight:700;opacity:.8">${d}</span></span>`).join('')}</div>
    <div class="root-tabs">${FAMILIES.map(x => `<button class="root-tab ${x.root === S.root ? 'active' : ''}" data-root="${x.root}">${x.root}</button>`).join('')}</div>
    <div class="wt-card"><div class="wt-scroll"><div class="wt-tree"><ul><li>
      <div class="wt-node wt-hub"><span class="wt-w">${f.root}</span><span class="wt-mean">${esc(f.en)}</span></div>
      <ul>${f.kids.map((k, i) => `<li><div class="wt-node ${S.openNode === i ? 'open' : ''}" data-node="${i}"><span class="wt-w">${famWord(k.parts)}</span><span class="wt-mean">${esc(k.en)}</span><div class="wt-detail">${esc(k.note)}</div></div></li>`).join('')}</ul>
    </li></ul></div></div></div>
    <div class="section-label">Breakdown</div>
    <div class="fam-list">${f.kids.map(k => `<div class="list-item"><span class="parts" style="flex:1">${k.parts.map(([t, c]) => `<span class="part ${c}">${esc(t)}</span>`).join('<span class="plus">+</span>')}</span><span class="srs-meaning" style="text-align:right">${esc(k.en)}</span></div>`).join('')}</div>
  </div>`;
}

function More() {
  if (S.view === 'quiz') return Quiz();
  if (S.view === 'dialogue') return Dialogue();
  if (S.view === 'stats') return Stats();
  if (S.view === 'settings') return Settings();
  const items = [
    ['dialogue', '💬', 'Dialogues', 'Real conversations, line by line', '#1CB0F6'],
    ['quiz', '🧠', 'Quiz', 'Multiple choice · type · match', '#CE82FF'],
    ['jawi', 'ج', 'Jawi script', 'Read the Arabic-based script', '#FF9600'],
    ['numbers', '🔢', 'Number trainer', 'Hear a price, type the number', '#58CC02'],
    ['sentences', '📝', 'Sentences', 'Example sentences by word', '#FF6B8A'],
    ['stats', '📊', 'Stats', 'Progress by source', '#FFC800'],
    ['settings', '⚙️', 'Settings', 'Jawi layer, slang notes, audio', '#8A9AA6'],
  ];
  return `<div class="pad">
    <div class="setup-header"><div><div class="setup-h1">More</div><div class="setup-h2">Tools & practice</div></div></div>
    ${items.map(([id, ic, lb, d, c]) => `<button class="more-item" style="--c:${c}" data-more="${id}"><div class="more-icon ${id === 'jawi' ? 'jawi' : ''}" style="${id === 'jawi' ? 'font-size:24px;color:' + c : ''}">${ic}</div><div style="min-width:0"><div class="more-label">${lb}</div><div class="more-desc">${d}</div></div><div class="more-arrow">›</div></button>`).join('')}
    <p class="muted" style="font-size:12px;font-weight:700;margin-top:14px"><span class="proto-chip">Prototype</span> Sample data. Jawi spellings still need a native-speaker check.</p>
  </div>`;
}
const backBtn = to => `<button class="setup-back" data-back="${to}" aria-label="Back">‹</button>`;

function Quiz() {
  const q = S.quiz;
  if (q.i >= q.qs.length) return `<div class="pad"><div class="res-hero"><div style="font-size:44px">🧠</div><div class="res-big" style="color:var(--purple)">${q.score}/${q.qs.length}</div><div style="font-weight:900;font-size:18px;margin-top:8px">${q.score >= 4 ? 'Hebat! Great job' : 'Good effort, keep going'}</div></div><button class="btn-primary" data-action="quiz" style="background:var(--purple)">↻ New quiz</button><button class="btn-primary" data-back="more" style="background:var(--surface);color:var(--text);border:2px solid var(--border)">Done</button></div>`;
  const cur = q.qs[q.i];
  return `<div class="pad">
    <div class="setup-header">${backBtn('more')}<div><div class="setup-h1">🧠 Quiz</div><div class="setup-h2">Question ${q.i + 1} of ${q.qs.length} · score ${q.score}</div></div></div>
    <div class="progress-bar" style="margin-bottom:16px"><div class="progress-fill" style="width:${q.i / q.qs.length * 100}%;background:var(--purple)"></div></div>
    <div class="q-prompt">What does this mean?</div>
    <div class="word-card"><button class="speak-btn" data-action="speak" data-text="${esc(cur.w.ms)}" aria-label="Play">🔊</button><div class="word-card-text">${esc(cur.w.ms)}</div></div>
    <div class="q-opts">${cur.opts.map((o, i) => { let c = ''; if (q.picked != null) { if (o.id === cur.w.id) c = 'right'; else if (i === q.picked) c = 'wrong'; } return `<button class="q-opt ${c}" data-opt="${i}" ${q.picked != null ? 'disabled' : ''}>${esc(o.en)}</button>`; }).join('')}</div>
    ${q.picked != null ? `<button class="btn-primary" data-action="quiz-next" style="background:var(--purple);margin-top:14px">${q.i === q.qs.length - 1 ? 'See score' : 'Next →'}</button>` : ''}
  </div>`;
}
function newQuiz() {
  const pool = shuffle(WORDS).slice(0, 5);
  S.quiz = { i: 0, score: 0, picked: null, qs: pool.map(w => ({ w, opts: shuffle([w, ...shuffle(WORDS.filter(x => x.id !== w.id)).slice(0, 3)]) })) };
}

function Dialogue() {
  return `<div class="pad">
    <div class="setup-header">${backBtn('more')}<div><div class="setup-h1">Di Gerai Mamak</div><div class="setup-h2">At the mamak stall · Unit 3</div></div></div>
    <div style="display:flex;gap:8px;margin-bottom:16px"><button class="mode-btn ${S.showEn ? 'active' : ''}" data-action="toggle-en">English ${S.showEn ? 'on' : 'off'}</button><button class="mode-btn" data-action="play-all">🔊 Play all</button></div>
    ${DIALOGUE.map(([s, who, ms, en]) => `<div class="bubble ${s === 'B' ? 'b' : ''}" data-action="speak" data-text="${esc(ms)}" style="cursor:pointer"><div class="who">${who}</div><div class="ms">${esc(ms)}</div>${S.showEn ? `<div class="en">${esc(en)}</div>` : ''}</div>`).join('')}
    <p class="muted" style="font-size:12px;font-weight:700;margin-top:10px">💡 <b style="color:var(--yellow)">bang</b> (from abang, “big brother”) is a friendly way to address a man at a stall.</p>
  </div>`;
}

function Stats() {
  const prog = [['asas', 82], ['makan', 46], ['jalan', 18], ['nombor', 64], ['pasar', 30]];
  return `<div class="pad">
    <div class="setup-header">${backBtn('more')}<div><div class="setup-h1">📊 Stats</div><div class="setup-h2">Example data</div></div></div>
    <div class="res-grid" style="margin-top:0"><div class="tile"><div class="tile-num" style="color:var(--orange)">12🔥</div><div class="tile-label">Day streak</div></div><div class="tile"><div class="tile-num" style="color:var(--green)">186</div><div class="tile-label">Words seen</div></div><div class="tile"><div class="tile-num" style="color:var(--yellow)">42</div><div class="tile-label">Mastered</div></div></div>
    <div class="section-label">Progress by source</div>
    ${prog.map(([id, p]) => { const s = srcOf(id); return `<div class="bar-row"><span style="width:22px">${s.icon}</span><span style="width:92px">${s.name.split(' · ')[0]}</span><div class="track"><i style="width:${p}%;background:${s.color}"></i></div><span class="n">${p}%</span></div>`; }).join('')}
  </div>`;
}

function Settings() {
  const rows = [['jawi', 'Show Jawi layer', 'Adds Jawi script to the reveal steps'], ['colloquial', 'Colloquial notes', 'Show spoken forms like “tak” for “tidak”'], ['autoSpeak', 'Auto-play audio', 'Speak each card as it appears']];
  return `<div class="pad">

    ${rows.map(([k, l, d]) => `<div class="toggle-row"><div><div class="more-label">${l}</div><div class="more-desc">${d}</div></div><button class="switch ${S.settings[k] ? 'on' : ''}" data-setting="${k}" role="switch" aria-checked="${S.settings[k]}" aria-label="${l}"></button></div>`).join('')}
  </div>`;
}

// ═══ RENDER + EVENTS ═══
function render() {
  const c = $('#content');
  if (S.tab === 'home') c.innerHTML = Home();
  else if (S.tab === 'study') c.innerHTML = S.view === 'session' ? Session() : S.view === 'results' ? Results() : StudySetup();
  else if (S.tab === 'srs') c.innerHTML = SRS();
  else if (S.tab === 'course') c.innerHTML = Course();
  else if (S.tab === 'groups') c.innerHTML = Groups();
  else c.innerHTML = More();
  renderTabs();
}
function startSession() {
  const pool = WORDS.filter(w => w.src === S.source);
  S.session = shuffle(pool).slice(0, S.perSession);
  S.idx = 0; S.reveal = 0; S.ratings = {};
  S.tab = 'study'; S.view = 'session'; render(); window.scrollTo(0, 0);
  if (S.settings.autoSpeak || S.mode === 'listen') speak(S.session[0].ms);
}
function moveCard(d) {
  S.idx += d; S.reveal = 0; render();
  if (S.settings.autoSpeak || S.mode === 'listen') speak(S.session[S.idx].ms);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-go],[data-action],[data-mode],[data-num],[data-source],[data-rate],[data-srs],[data-unit],[data-step],[data-root],[data-node],[data-more],[data-back],[data-opt],[data-setting]');
  if (!el || el.closest('.modal-overlay')) return;
  const d = el.dataset;
  if (d.tab) {
    // Re-tapping Study returns to setup; coming back from another tab resumes the session.
    if (d.tab === 'course') S.openUnit = null;
    return go(d.tab, d.tab === 'study' && S.tab !== 'study' ? S.lastStudyView : null);
  }
  if (d.go) { const [t, v] = d.go.split(':'); return go(t, v); }
  if (d.back) return go(d.back);
  if (d.mode) { S.mode = d.mode; S.reveal = 0; render(); if (S.view === 'session' && d.mode === 'listen') speak(S.session[S.idx].ms); return; }
  if (d.num) { S.perSession = +d.num; return render(); }
  if (d.source) { S.source = d.source; return render(); }
  if (d.rate) { const w = S.session[S.idx]; S.ratings[w.id] = +d.rate; render(); if (S.idx < S.session.length - 1) setTimeout(() => moveCard(1), 260); return; }
  if (d.srs) { const q = S.srsQueue.find(q => q.due === 'Now'); q.due = SRS_RESP[+d.srs].next; q.lvl = Math.max(0, Math.min(7, q.lvl + [-2, -1, 1, 2][+d.srs])); S.srsDone++; S.srsReveal = false; return render(); }
  if (d.unit) { if (el.classList.contains('locked')) return toast('Finish the previous unit to unlock'); S.openUnit = +d.unit; return render(); }
  if (d.step) { if (d.step === 'dialogue') return go('more', 'dialogue'); if (d.step === 'vocab') { S.source = 'makan'; return startSession(); } return toast(d.step === 'drill' ? 'Pattern drill — next build' : 'Unit check — next build'); }
  if (d.root) { S.root = d.root; S.openNode = null; return render(); }
  if (d.node) { S.openNode = S.openNode === +d.node ? null : +d.node; return render(); }
  if (d.more) { if (['quiz'].includes(d.more)) { newQuiz(); return go('more', 'quiz'); } if (['dialogue', 'stats', 'settings'].includes(d.more)) return go('more', d.more); return toast('Coming in the full build'); }
  if (d.opt) { const q = S.quiz; q.picked = +d.opt; if (q.qs[q.i].opts[q.picked].id === q.qs[q.i].w.id) q.score++; return render(); }
  if (d.setting) { S.settings[d.setting] = !S.settings[d.setting]; return render(); }
  switch (d.action) {
    case 'home-start': S.source = focus().src; S.mode = 'ms'; return startSession();
    case 'start': return startSession();
    case 'quiz': newQuiz(); return go('more', 'quiz');
    case 'quiz-next': S.quiz.i++; S.quiz.picked = null; return render();
    case 'speak': e.stopPropagation(); return speak(d.text);
    case 'reveal': { const n = revealLayers(S.session[S.idx]).length; if (S.reveal < n) { S.reveal++; render(); } return; }
    case 'next': if (S.idx < S.session.length - 1) return moveCard(1); S.view = 'results'; render(); return window.scrollTo(0, 0);
    case 'prev': if (S.idx > 0) moveCard(-1); return;
    case 'shuffle': S.session = shuffle(S.session); S.idx = 0; S.reveal = 0; return render();
    case 'end': S.view = null; return render();
    case 'story': return modal('📝 My Story', `<p class="muted" style="font-weight:700;font-size:13px;margin-bottom:10px">Write a memory hook for <b style="color:var(--text)">${esc(S.session[S.idx].ms)}</b>.</p><textarea id="story-text" rows="4" style="width:100%;border-radius:12px;background:var(--bg);border:2px solid var(--border);color:var(--text);padding:10px;font-family:var(--font);font-size:14px">${S.session[S.idx].ms === 'sedap' ? 'Sedap sounds like “said up”: you sit up and say “mmm” when food is delicious.' : ''}</textarea>`, 'var(--purple)');
    case 'family': { const w = wordById(+d.id); const root = (w.parts || []).find(p => p[1] === 'root')?.[0] || w.ms; const fam = FAMILIES.find(f => f.root === root || f.kids.some(k => k.parts.map(p => p[0]).join('') === w.ms)); return modal('🌳 Word family', fam ? `<div class="muted" style="font-weight:700;font-size:13px;margin-bottom:10px">Root <b style="color:var(--green)">${fam.root}</b> · ${esc(fam.en)}</div>${fam.kids.map(k => `<div class="list-item"><span class="parts" style="flex:1">${k.parts.map(([t, c]) => `<span class="part ${c}">${esc(t)}</span>`).join('<span class="plus">+</span>')}</span><span class="srs-meaning">${esc(k.en)}</span></div>`).join('')}` : `<p class="muted" style="font-weight:700"><b style="color:var(--text)">${esc(w.ms)}</b> has no affix family yet. Open the Imbuhan tab to explore roots like makan, ajar and jalan.</p>`, 'var(--green)'); }
    case 'toast': return toast(d.msg);
    case 'srs-start': S.srsDone = 0; S.srsReveal = false; return go('srs', 'review');
    case 'srs-show': S.srsReveal = true; return render();
    case 'srs-exit': return go('srs');
    case 'unit-close': S.openUnit = null; return render();
    case 'toggle-en': S.showEn = !S.showEn; return render();
    case 'play-all': return speak(DIALOGUE.map(l => l[2]).join('. '));
  }
});
try { speechSynthesis.getVoices(); } catch {}
render();
</script>
